<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A gamified study trail through the 13 sessions of the ALA 2026–27 first convening.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='5' fill='%23F4BD1E' stroke='%23171310' stroke-width='3' transform='rotate(-6 16 16)'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ALA Leadership Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a painted roadside — limewashed wall, signwriter boards with hard black outlines and drop shadows; the trail is a dirt road that gets tarred as stations are cleared. Single bright look by choice. */
:root{
  color-scheme:light;
  --wall:#F1E1B8; --wall-2:#E6D19F; --board:#FFFCF1; --ink:#171310; --muted:#5B4F42;
  --blue:#1F55B0; --red:#D0342A; --green:#1D8748; --yellow:#F4BD1E; --sky:#BFE0F2;
  --dirt:#D6BC86; --tar:#2B2724;
  --soft-green:#CFEBD8; --soft-red:#F8D4CF;
  --f-display:"Bungee", "Arial Black", Impact, system-ui, sans-serif;
  --f-body:"Archivo", "Segoe UI", system-ui, sans-serif;
  --ol:3px solid var(--ink); --sh:5px 5px 0 var(--ink); --r:10px;
}
*{box-sizing:border-box}
body{background:var(--wall);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse at 15% 20%,rgba(255,255,255,.45),transparent 45%),radial-gradient(ellipse at 85% 60%,rgba(150,105,40,.13),transparent 50%),radial-gradient(ellipse at 40% 95%,rgba(255,255,255,.3),transparent 40%),repeating-linear-gradient(97deg,rgba(90,60,20,.035) 0 3px,transparent 3px 11px);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px dashed var(--red);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0;letter-spacing:.01em}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-body);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* top bar: painted blue fascia */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--blue);border-bottom:4px solid var(--ink);box-shadow:0 4px 0 var(--yellow)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:17px;background:none;border:0;padding:2px 0;color:#fff;text-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;gap:8px}
.brand i{width:20px;height:20px;background:var(--yellow);border:2px solid var(--ink);border-radius:4px;transform:rotate(-6deg);display:inline-block;box-shadow:2px 2px 0 var(--ink)}
.stats{display:flex;gap:8px;margin-left:auto;align-items:center}
.chip{font-weight:800;font-size:13px;padding:5px 10px;border-radius:6px;border:2px solid var(--ink);background:var(--board);display:flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:2px 2px 0 var(--ink)}
.chip.xp{background:var(--yellow)}
.chip .meter{width:46px;height:8px;border-radius:2px;border:1.5px solid var(--ink);background:var(--board);overflow:hidden}
.chip .meter b{display:block;height:100%;background:var(--red)}
nav.tabs{display:flex;gap:6px;width:100%;overflow-x:auto;padding:2px 2px 4px}
nav.tabs button{background:transparent;border:2px solid transparent;padding:5px 12px;border-radius:6px;font-family:var(--f-display);font-size:13px;color:#DCE7FA;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--yellow);color:var(--ink);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}

main{padding-block:26px 90px}

/* shared board + button */
.board{background:var(--board);border:var(--ol);border-radius:var(--r);box-shadow:var(--sh)}
.btn{border:var(--ol);border-radius:8px;padding:10px 18px;font-family:var(--f-display);font-size:15px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:8px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.copper,.btn.light{background:var(--red);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--board);color:var(--ink)}
.btn:not(.ghost):not(.copper):not(.light){background:var(--blue);text-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* hero: the shop sign */
.hero{background:var(--yellow);border:4px solid var(--ink);border-radius:12px;padding:26px 24px 24px;position:relative;
  box-shadow:inset 0 0 0 9px var(--yellow),inset 0 0 0 13px var(--red),8px 8px 0 var(--ink)}
.hero .strip{display:inline-block;background:var(--blue);color:#fff;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:5px 12px;border:2px solid var(--ink);transform:rotate(-1.5deg);box-shadow:3px 3px 0 var(--ink)}
.hero h1{font-size:clamp(34px,8vw,64px);color:var(--red);text-shadow:4px 4px 0 var(--ink);margin:14px 0 10px;line-height:.95}
.hero h1 span{color:var(--blue);display:block}
.hero p{max-width:52ch;margin:0;font-weight:500}
.hero .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--board);border:var(--ol);border-radius:8px;padding:8px 14px;min-width:110px;box-shadow:3px 3px 0 var(--ink)}
.stat:nth-child(2){transform:rotate(1deg)} .stat:nth-child(3){transform:rotate(-1deg)}
.stat b{font-family:var(--f-display);font-size:22px;display:block;font-variant-numeric:tabular-nums;font-weight:400}
.stat span{font-size:12.5px;font-weight:700;color:var(--muted)}

/* trail: road */
.trail{position:relative;margin-top:34px}
.trail>svg{position:absolute;inset:0;width:100%;overflow:visible}
.road{fill:none;stroke-width:34;stroke-linecap:round;vector-effect:non-scaling-stroke}
.road.edge{stroke:var(--ink);stroke-width:40}
.road.todo{stroke:var(--dirt)} .road.done{stroke:var(--tar)}
.lane{fill:none;stroke-width:3;stroke-dasharray:12 12;vector-effect:non-scaling-stroke;stroke-linecap:round}
.lane.todo{stroke:rgba(90,60,25,.35)} .lane.done{stroke:var(--yellow)}
.camp{position:absolute;left:0;right:0;display:flex;justify-content:center;z-index:1}
.camp>div{border:var(--ol);border-radius:8px;padding:8px 18px;text-align:center;box-shadow:var(--sh);color:#fff;transform:rotate(-1.2deg);max-width:92%}
.camp .eyebrow{color:inherit;opacity:.85}
.camp h3{font-size:18px;text-shadow:2px 2px 0 var(--ink)}
.camp small{display:block;font-weight:600;font-size:13px}
.a0{background:var(--blue)} .a1{background:var(--red)} .a2{background:var(--green)} .a3{background:var(--yellow);color:var(--ink)!important}
.camp .a3 h3{text-shadow:2px 2px 0 #fff}
.node{position:absolute;transform:translate(-50%,-31px);display:flex;flex-direction:column;align-items:center;width:min(160px,44vw);background:none;border:0;padding:0;text-align:center;z-index:2}
.node .disc{width:70px;height:62px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;background:var(--board);border:var(--ol);box-shadow:4px 4px 0 var(--ink);transition:transform .15s}
.node.c0 .disc{color:var(--blue)} .node.c1 .disc{color:var(--red)} .node.c2 .disc{color:var(--green)} .node.c3 .disc{color:#B8860B}
.node.done .disc{color:#fff;text-shadow:2px 2px 0 var(--ink)}
.node.done.c0 .disc{background:var(--blue)} .node.done.c1 .disc{background:var(--red)} .node.done.c2 .disc{background:var(--green)} .node.done.c3 .disc{background:var(--yellow);color:var(--ink);text-shadow:2px 2px 0 #fff}
.node.started .disc{border-style:dashed}
.node:hover .disc{transform:rotate(-4deg) scale(1.05)}
.node .post{width:7px;height:12px;background:var(--ink)}
.node.next .disc{animation:wobble 1.8s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.node .lbl{font-weight:800;font-size:13px;line-height:1.2;background:var(--board);border:2px solid var(--ink);border-radius:5px;padding:3px 8px;box-shadow:2px 2px 0 var(--ink)}
.stars{display:flex;gap:2px;justify-content:center;margin-top:5px}
.stars svg{width:15px;height:15px}
.stars .on{fill:var(--yellow);stroke:var(--ink);stroke-width:1.6} .stars .off{fill:rgba(60,40,15,.15);stroke:rgba(60,40,15,.35);stroke-width:1.2}

/* station */
.back{background:var(--board);border:2px solid var(--ink);border-radius:6px;font-weight:800;padding:4px 12px;margin-bottom:16px;box-shadow:2px 2px 0 var(--ink)}
.st-head{display:flex;gap:16px;align-items:flex-start}
.st-num{flex:none;width:66px;height:60px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;color:#fff;border:var(--ol);box-shadow:4px 4px 0 var(--ink);text-shadow:2px 2px 0 var(--ink);transform:rotate(-3deg)}
.st-num.a3{text-shadow:2px 2px 0 #fff}
.st-head h1{font-size:clamp(22px,4.4vw,32px);margin-top:4px}
section.block{margin-top:34px}
section.block>h2{font-size:19px;display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
section.block>h2 .tag{font-family:var(--f-body);font-size:11.5px;font-weight:800;letter-spacing:.1em;background:var(--ink);color:var(--yellow);padding:4px 9px;border-radius:4px;transform:rotate(-2deg)}
.plain{font-size:18.5px;line-height:1.6;max-width:62ch;margin:0;font-weight:500}
.hook{margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--red);color:#fff;border:var(--ol);box-shadow:var(--sh);display:flex;gap:12px;align-items:flex-start;max-width:62ch;font-weight:600}
.hook b{font-family:var(--f-display);font-weight:400;font-size:12px;color:var(--yellow);flex:none;padding-top:3px;text-shadow:1px 1px 0 var(--ink)}
.src{font-size:13px;color:var(--muted);margin-top:14px;font-weight:500}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{display:block;width:100%;perspective:900px;background:none;border:0;padding:0;min-height:180px;text-align:left}
.card .in{display:block;position:relative;width:100%;height:100%;min-height:180px;transition:transform .45s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f>*,.card .b>*{display:block}
.card .f,.card .b{position:absolute;inset:0;border-radius:var(--r);padding:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;overflow:auto;border:var(--ol);box-shadow:var(--sh)}
.card .f{color:#fff}
.card.c0 .f{background:var(--blue)} .card.c1 .f{background:var(--red)} .card.c2 .f{background:var(--green)} .card.c3 .f{background:var(--yellow);color:var(--ink)}
.card .f h3{font-size:18px;margin-top:auto;margin-bottom:auto;text-shadow:2px 2px 0 var(--ink)}
.card.c3 .f h3{text-shadow:2px 2px 0 #fff}
.card .f small{font-size:11.5px;font-weight:800;letter-spacing:.1em;opacity:.9}
.card .b{background:var(--board);transform:rotateY(180deg);font-size:14.5px;line-height:1.45;gap:10px;font-weight:500}
.card .b em{font-style:normal;font-weight:800;color:var(--blue);font-size:13.5px;border-top:2px dashed var(--ink);padding-top:8px}
.card.seen .f small:first-child::after{content:" · SEEN ✓"}
.card:nth-child(3n+1) .in{rotate:-.6deg} .card:nth-child(3n+2) .in{rotate:.5deg}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}.node.next .disc{animation:none}}

details.case{background:var(--sky);border:var(--ol);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
details.case summary{font-family:var(--f-display);font-size:15px;cursor:pointer}
details.case p{margin:10px 0 0;max-width:65ch;font-weight:500}

/* quiz */
.quiz{background:var(--board);border:var(--ol);border-radius:12px;padding:20px;box-shadow:7px 7px 0 var(--ink)}
.pips{display:flex;gap:6px;margin-bottom:16px}
.pips i{flex:1;height:10px;border-radius:3px;border:2px solid var(--ink);background:var(--board)}
.pips i.ok{background:var(--green)} .pips i.meh{background:var(--yellow)} .pips i.cur{background:var(--ink)}
.q{font-size:19px;font-weight:700;margin:0 0 14px;max-width:62ch}
.qtype{font-weight:800;font-size:12px;letter-spacing:.12em;color:var(--red);text-transform:uppercase;margin-bottom:6px}
.opts{display:grid;gap:10px}
.opt{border:2.5px solid var(--ink);background:#fff;border-radius:8px;padding:12px 14px;text-align:left;font-size:15px;font-weight:600;line-height:1.4;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.opt.right{background:var(--soft-green);border-color:var(--green);box-shadow:3px 3px 0 var(--green)}
.opt.wrong{background:var(--soft-red);border-color:var(--red);box-shadow:3px 3px 0 var(--red);text-decoration:line-through}
.opt.sel{background:var(--yellow)}
.opt:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:10px;align-content:start;min-width:0}
.opt .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;background:var(--red);color:#fff;border:2px solid var(--ink);font-size:11px;font-weight:800;margin-right:6px;vertical-align:1px}
.order-ans{min-height:56px;border:2.5px dashed var(--ink);border-radius:8px;padding:8px;display:grid;gap:8px;margin-bottom:12px;background:var(--wall)}
.order-ans:empty::before{content:"Tap the steps below in the right order";color:var(--muted);font-size:14px;font-weight:600;padding:8px}
.feedback{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:15px;max-width:65ch;border:2.5px solid var(--ink);font-weight:500}
.feedback.good{background:var(--soft-green)} .feedback.bad{background:var(--soft-red)}
.feedback b{display:block;margin-bottom:2px;font-family:var(--f-display);font-weight:400}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}
.done-card{text-align:center;padding:12px 4px}
.done-card .big-stars{display:flex;justify-content:center;gap:8px;margin:12px 0}
.done-card .big-stars svg{width:48px;height:48px}
.done-card h3{font-size:22px}

.move{background:var(--board);border:var(--ol);border-radius:12px;padding:20px;display:grid;gap:12px;box-shadow:var(--sh)}
.move label{font-weight:800;font-size:14px;display:grid;gap:6px}
.move textarea{font:inherit;font-size:15px;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:6px;padding:10px 12px;resize:vertical;min-height:46px}
.move .saved{color:var(--green);font-weight:800;font-size:14px}
.next-row{display:flex;justify-content:space-between;gap:10px;margin-top:34px;flex-wrap:wrap}

/* rapid fire */
.rf{background:var(--board);border:4px solid var(--ink);border-radius:12px;padding:24px;max-width:640px;margin:0 auto;box-shadow:inset 0 0 0 8px var(--board),inset 0 0 0 11px var(--green),8px 8px 0 var(--ink)}
.rf h1{color:var(--red);text-shadow:3px 3px 0 var(--ink)}
.rf-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.timer{height:14px;border-radius:4px;border:2.5px solid var(--ink);background:#fff;overflow:hidden;margin-bottom:18px}
.timer b{display:block;height:100%;background:var(--red);transition:width .25s linear}
.rf .from{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.flash-ok{animation:fok .4s} .flash-bad{animation:fbad .4s}
@keyframes fok{30%{background:var(--soft-green)}} @keyframes fbad{30%{background:var(--soft-red)}}

/* cheat sheet */
.search{width:100%;font:inherit;font-weight:600;padding:12px 14px;border-radius:8px;border:var(--ol);background:#fff;color:var(--ink);margin:16px 0;box-shadow:3px 3px 0 var(--ink)}
.sheet{display:grid;gap:18px}
.sheet article{background:var(--board);border:var(--ol);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.sheet h3{font-size:16px;margin-bottom:8px;display:flex;gap:10px;align-items:baseline}
.sheet h3 span{color:var(--red)}
.sheet p{margin:0 0 10px;color:var(--muted);font-size:14.5px;font-weight:500}
.sheet dl{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:5px 14px;margin:0;font-size:14px}
.sheet dt{font-weight:800}
.sheet dd{margin:0;min-width:0}
@media (max-width:520px){.sheet dl{grid-template-columns:1fr}.sheet dd{margin-bottom:6px}}

/* progress */
.page-h{font-size:clamp(28px,5.4vw,42px);margin:6px 0 8px;color:var(--red);text-shadow:3px 3px 0 var(--ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.badge{background:var(--board);border:var(--ol);border-radius:var(--r);padding:16px 12px;text-align:center;box-shadow:4px 4px 0 var(--ink)}
.badge .hex{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:var(--wall-2);color:var(--muted)}
.badge.on .hex{background:var(--red);color:#fff;text-shadow:2px 2px 0 var(--ink);box-shadow:inset 0 0 0 4px var(--yellow)}
.badge b{display:block;font-size:14px;font-weight:800}
.badge small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block;margin-top:2px}
.badge:not(.on){opacity:.65;box-shadow:none;border-style:dashed}
.journal{display:grid;gap:12px}
.journal article{background:var(--board);border:var(--ol);border-radius:var(--r);padding:14px 16px;box-shadow:4px 4px 0 var(--ink)}
.journal h3{font-size:14px;margin-bottom:6px}
.journal p{margin:2px 0;font-size:14.5px}
.journal p span{color:var(--muted);font-weight:700}
.ranks{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ranks span{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:5px;border:2px solid var(--ink);background:var(--board);color:var(--muted)}
.ranks span.on{background:var(--green);color:#fff}

/* toast + modal */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:grid;gap:8px;justify-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--yellow);color:var(--ink);border:var(--ol);padding:8px 16px;border-radius:8px;font-family:var(--f-display);font-size:14px;animation:tin .25s;box-shadow:4px 4px 0 var(--ink)}
@keyframes tin{from{transform:translateY(10px) rotate(-3deg);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(23,19,16,.6);display:grid;place-items:center;z-index:60;padding:16px}
.modal>div{background:var(--yellow);border:4px solid var(--ink);border-radius:12px;padding:26px 22px;max-width:360px;width:100%;text-align:center;box-shadow:inset 0 0 0 8px var(--yellow),inset 0 0 0 11px var(--red),8px 8px 0 var(--ink)}
.modal .hex{width:80px;height:80px;margin:0 auto 12px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:26px;background:var(--red);color:#fff;text-shadow:2px 2px 0 var(--ink);box-shadow:inset 0 0 0 5px var(--board)}
.modal h3{font-size:20px;margin-bottom:6px}
.modal p{margin:0 0 16px;font-weight:600}
@media (max-width:560px){
  .hero{padding:22px 18px}
  .match{grid-template-columns:1fr}
  .match .col.r{border-top:2.5px dashed var(--ink);padding-top:12px}
  .stats .chip.streak{display:none}
  .road{stroke-width:26}.road.edge{stroke-width:31}
}

/* match pairs */
.mhelp{margin:-4px 0 12px;font-size:14px;color:var(--muted);font-weight:600}
.opt.mt{display:flex;align-items:center;gap:10px}
.opt.mt .tx{flex:1;min-width:0}
.pt{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:6px;border:2.5px solid var(--ink);font-family:var(--f-display);font-size:14px;color:#fff;text-shadow:1px 1px 0 var(--ink)}
.pt.empty{background:#fff;color:var(--muted);border-style:dashed;text-shadow:none}
.p0{--pc:#1F55B0;--pt:#D6E3F7} .p1{--pc:#D0342A;--pt:#F9DAD5} .p2{--pc:#1D8748;--pt:#D3EEDD} .p3{--pc:#E0A800;--pt:#FCEFC2} .p4{--pc:#7B3FB2;--pt:#E9DCF5} .p5{--pc:#E0661B;--pt:#FBE0CD}
.pt.p0,.pt.p1,.pt.p2,.pt.p3,.pt.p4,.pt.p5{background:var(--pc)}
.opt.paired{background:var(--pt);border-color:var(--pc);border-left-width:10px;box-shadow:3px 3px 0 var(--pc)}
.opt.picking{background:var(--yellow);outline:3px dashed var(--ink);outline-offset:2px}
.opt.picking::after{content:"→";font-family:var(--f-display);font-size:18px}
.opt.lock{opacity:1;cursor:default}
.res{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;color:#fff;border:2.5px solid var(--ink)}
.res.ok{background:var(--green)} .res.bad{background:var(--red)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pairs-done{display:grid;gap:10px}
.pairs-done .pr{display:grid;grid-template-columns:auto minmax(0,auto) auto minmax(0,1fr);align-items:center;gap:10px;background:var(--soft-green);border:2.5px solid var(--green);border-radius:8px;padding:10px 12px;box-shadow:3px 3px 0 var(--green);font-size:15px}
.pairs-done .arr{font-family:var(--f-display);color:var(--green)}
@media (max-width:560px){.pairs-done .pr{grid-template-columns:auto 1fr}.pairs-done .arr{display:none}.pairs-done .pr>span:last-child{grid-column:2}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
